      function loadSettings() {
        let saved = null;
        try {
          saved = localStorage.getItem('fontPreviewSettings');
        } catch (e) {
          console.warn('读取本地设置失败', e);
        }
        if (!saved) {
          drawPreviewCanvas();
          return;
        }
        try {
          const settings = JSON.parse(saved);
          
          if (settings.fontSize) {
            fontSizeRange.value = settings.fontSize;
            fontSizeValue.textContent = settings.fontSize + 'px';
          }
          if (settings.textColor) {
            textColorPicker.value = settings.textColor;
            textColorHex.textContent = settings.textColor;
          }
          if (settings.strokeSize !== undefined) {
            strokeSizeRange.value = settings.strokeSize;
            strokeSizeValue.textContent = settings.strokeSize + 'px';
          }
          if (settings.strokeColor) {
            strokeColorPicker.value = settings.strokeColor;
          }
          if (settings.shadowSize !== undefined) {
            shadowSizeRange.value = settings.shadowSize;
            shadowSizeValue.textContent = settings.shadowSize + 'px';
          }
          if (settings.shadowColor) {
            shadowColorPicker.value = settings.shadowColor;
          }
          
          if (settings.commercial) commercialSelect.value = settings.commercial;
          if (settings.bgSource) bgSourceInput.value = settings.bgSource;
          
          if (settings.customColors) {
            customColor1.value = settings.customColors[0];
            customColor2.value = settings.customColors[1];
            customColor3.value = settings.customColors[2];
            customColor4.value = settings.customColors[3];
            customColor5.value = settings.customColors[4];
          }
          if (settings.useColors) {
            useColor1.checked = settings.useColors[0];
            useColor2.checked = settings.useColors[1];
            useColor3.checked = settings.useColors[2];
            useColor4.checked = settings.useColors[3];
            useColor5.checked = settings.useColors[4];
          }

          if (settings.align) {
            currentAlign = settings.align;
            alignBtns.forEach(b => {
              b.classList.toggle('active', b.dataset.align === currentAlign);
            });
          }
          if (settings.titleFirstLine !== undefined) {
            titleFirstLineCheckbox.checked = settings.titleFirstLine;
          }

          const fontPromise = new Promise((resolve) => {
            if (settings.uploadedFontBase64) {
              uploadedFontBase64 = settings.uploadedFontBase64;
              const uniqueFontFamily = `CustomFont_${Date.now()}`;
              const style = document.createElement('style');
              style.id = 'dynamic-font-style';
              style.textContent = `
                @font-face {
                  font-family: '${uniqueFontFamily}';
                  src: url('${uploadedFontBase64}');
                }
              `;
              document.head.appendChild(style);
              currentFontFamily = `'${uniqueFontFamily}', 'Arial', sans-serif`;
              currentFontDisplayName = settings.fontDisplayName || '自定义字体';
              currentFontNameSpan.textContent = currentFontDisplayName;
              
              document.fonts.load(`16px "${uniqueFontFamily}"`).then(resolve).catch(resolve);
            } else if (settings.fontFamily) {
              currentFontFamily = settings.fontFamily;
              const matchedOption = Array.from(systemFontSelect.options).find(function(option) {
                return option.value === settings.fontFamily;
              });
              if (matchedOption) systemFontSelect.value = settings.fontFamily;
              currentFontDisplayName = matchedOption ? matchedOption.text : (settings.fontDisplayName || '系统默认');
              currentFontNameSpan.textContent = currentFontDisplayName;
              resolve();
            } else {
              resolve();
            }
          });

          const bgPromise = new Promise((resolve) => {
            if (settings.uploadedBgImageUrl) {
              uploadedBgImageUrl = settings.uploadedBgImageUrl;
              img = new Image();
              imgLoaded = false;
              img.onload = function() {
                imgLoaded = true;
                cropRect = { x: 0, y: 0, w: img.width, h: img.height };
                useBgImage = settings.useBgImage;
                useBgImageCheckbox.checked = useBgImage;
                
                if (settings.activeGradient) {
                  activeGradient = settings.activeGradient;
                  renderGradientGrid();
                }
                resolve();
              };
              img.onerror = function() {
                console.warn('保存的背景图已失效，已跳过。');
                imgLoaded = false;
                useBgImage = false;
                resolve();
              };
              img.src = uploadedBgImageUrl;
            } else {
              if (settings.activeGradient) {
                activeGradient = settings.activeGradient;
                useBgImage = false;
                useBgImageCheckbox.checked = false;
                renderGradientGrid();
              }
              resolve();
            }
          });

          Promise.all([fontPromise, bgPromise]).then(() => {
            drawPreviewCanvas();
          });
          
        } catch (e) {
          console.error('读取设置失败:', e);
          drawPreviewCanvas();
        }
      }

      // 初始化所有（文案库要等 fengmian.json 读取完成）
      (async function init() {
        drawPreviewCanvas();          // 先画一次空背景，避免页面一片空白
        await initTextPresets();      // 读取 fengmian.json
        loadSettings();               // 读取上次保存的设置
        restoreSaveDirectoryHandle(); // 恢复上次选择的下载文件夹
        if (!previewTextInput.value && textPresets.length > 0) {
          previewTextInput.value = textPresets[0].content;
        }
        // 让下拉框显示与当前文字真正对应的文案
        syncTextPresetUI(textPresets.findIndex(function(p) { return p.content === previewTextInput.value; }));
        drawPreviewCanvas();
      })().catch(function(err) {
        console.error('页面初始化失败:', err);
      });

      // 裁剪模态逻辑
      openCropModalBtn.addEventListener('click', function() {
        if (!uploadedBgImageUrl) return alert('请先上传背景图片');
        if (!imgLoaded) return alert('图片正在加载，请稍后再试');
        openCropModal();
      });

      function openCropModal() {
        cropModal.classList.add('active');
        cropperWrapper.innerHTML = '';
        canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx = canvas.getContext('2d');
        
        cropRatioSelect.value = 'free';
        cropRect = { x: 0, y: 0, w: img.width, h: img.height };
        cropDragMode = null;
        cropActiveHandle = null;
        cropStartRect = null;
        cropStartPoint = null;
        canvas.style.cursor = 'crosshair';
        
        canvas.style.maxWidth = '100%';
        canvas.style.maxHeight = '100%';
        canvas.style.objectFit = 'contain';
        cropperWrapper.appendChild(canvas);
        
        drawCanvas();
        
        canvas.addEventListener('mousedown', onMouseDown);
        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('mouseup', onMouseUp);
        canvas.addEventListener('mouseleave', onMouseUp);
      }

      function getCropHandleRadius() {
        const rect = canvas.getBoundingClientRect();
        const scale = rect.width > 0 ? canvas.width / rect.width : 1;
        // 始终保证手柄在屏幕上大约 10px，方便点中
        return Math.max(6, 10 * scale, 10 / scale);
      }

      function getCropRatio() {
        const value = cropRatioSelect.value;
        if (value === 'free') return null;
        if (value === '16:9') return 16 / 9;
        if (value === '4:3') return 4 / 3;
        if (value === '1:1') return 1;
        return 3 / 4;
      }

      function getCropMinSize() {
        return Math.max(12, Math.min(img.width, img.height) * 0.02);
      }

      function clampCropRect(rect) {
        const minSize = getCropMinSize();
        const w = Math.max(minSize, Math.min(rect.w, img.width));
        const h = Math.max(minSize, Math.min(rect.h, img.height));
        const x = Math.max(0, Math.min(rect.x, img.width - w));
        const y = Math.max(0, Math.min(rect.y, img.height - h));
        return { x: x, y: y, w: w, h: h };
      }

      function applyCropRatio(rect, ratio) {
        if (!ratio) return rect;

        let w = rect.w;
        let h = rect.h;
        if (w / h > ratio) w = h * ratio;
        else h = w / ratio;

        let x = rect.x + (rect.w - w) / 2;
        let y = rect.y + (rect.h - h) / 2;

        if (w > img.width) { w = img.width; h = w / ratio; }
        if (h > img.height) { h = img.height; w = h * ratio; }

        x = Math.max(0, Math.min(x, img.width - w));
        y = Math.max(0, Math.min(y, img.height - h));
        return { x: x, y: y, w: w, h: h };
      }

      function getCropHandles() {
        const x = cropRect.x;
        const y = cropRect.y;
        const w = cropRect.w;
        const h = cropRect.h;
        return {
          nw: [x, y],
          n: [x + w / 2, y],
          ne: [x + w, y],
          e: [x + w, y + h / 2],
          se: [x + w, y + h],
          s: [x + w / 2, y + h],
          sw: [x, y + h],
          w: [x, y + h / 2]
        };
      }

      function getCropHandleAt(x, y) {
        const handles = getCropHandles();
        const hit = getCropHandleRadius() * 1.6;
        const order = ['nw', 'ne', 'sw', 'se', 'n', 's', 'e', 'w'];
        for (let i = 0; i < order.length; i++) {
          const key = order[i];
          const point = handles[key];
          if (Math.abs(x - point[0]) <= hit && Math.abs(y - point[1]) <= hit) return key;
        }
        return null;
      }

      function pointInCropRect(x, y) {
        return x >= cropRect.x && x <= cropRect.x + cropRect.w &&
               y >= cropRect.y && y <= cropRect.y + cropRect.h;
      }

      function makeCropRect(start, end) {
        const minSize = getCropMinSize();
        const x = Math.min(start.x, end.x);
        const y = Math.min(start.y, end.y);
        const w = Math.max(minSize, Math.abs(end.x - start.x));
        const h = Math.max(minSize, Math.abs(end.y - start.y));
        return clampCropRect({ x: x, y: y, w: w, h: h });
      }

      function resizeCropRect(start, handle, x, y) {
        const minSize = getCropMinSize();
        let left = start.x;
        let top = start.y;
        let right = start.x + start.w;
        let bottom = start.y + start.h;

        if (handle.indexOf('w') !== -1) left = Math.min(x, right - minSize);
        if (handle.indexOf('e') !== -1) right = Math.max(x, left + minSize);
        if (handle.indexOf('n') !== -1) top = Math.min(y, bottom - minSize);
        if (handle.indexOf('s') !== -1) bottom = Math.max(y, top + minSize);

        left = Math.max(0, left);
        top = Math.max(0, top);
        right = Math.min(img.width, right);
        bottom = Math.min(img.height, bottom);

        if (right - left < minSize) {
          if (handle.indexOf('w') !== -1) left = Math.max(0, right - minSize);
          else right = Math.min(img.width, left + minSize);
        }
        if (bottom - top < minSize) {
          if (handle.indexOf('n') !== -1) top = Math.max(0, bottom - minSize);
          else bottom = Math.min(img.height, top + minSize);
        }

        return { x: left, y: top, w: right - left, h: bottom - top };
      }

      function drawCanvas() {
        if (!ctx || !imgLoaded) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        // 选区外面压暗
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, canvas.width, cropRect.y);
        ctx.fillRect(0, cropRect.y + cropRect.h, canvas.width, canvas.height - (cropRect.y + cropRect.h));
        ctx.fillRect(0, cropRect.y, cropRect.x, cropRect.h);
        ctx.fillRect(cropRect.x + cropRect.w, cropRect.y, canvas.width - (cropRect.x + cropRect.w), cropRect.h);

        // 边框
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = Math.max(2, getCropHandleRadius() * 0.25);
        ctx.strokeRect(cropRect.x, cropRect.y, cropRect.w, cropRect.h);

        // 三分线
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cropRect.x + cropRect.w / 3, cropRect.y);
        ctx.lineTo(cropRect.x + cropRect.w / 3, cropRect.y + cropRect.h);
        ctx.moveTo(cropRect.x + cropRect.w * 2 / 3, cropRect.y);
        ctx.lineTo(cropRect.x + cropRect.w * 2 / 3, cropRect.y + cropRect.h);
        ctx.moveTo(cropRect.x, cropRect.y + cropRect.h / 3);
        ctx.lineTo(cropRect.x + cropRect.w, cropRect.y + cropRect.h / 3);
        ctx.moveTo(cropRect.x, cropRect.y + cropRect.h * 2 / 3);
        ctx.lineTo(cropRect.x + cropRect.w, cropRect.y + cropRect.h * 2 / 3);
        ctx.stroke();

        // 八个拖拽手柄
        const handles = getCropHandles();
        const r = Math.max(4, getCropHandleRadius() * 0.6);
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = Math.max(1, getCropHandleRadius() * 0.12);
        Object.keys(handles).forEach(function(key) {
          const point = handles[key];
          ctx.fillRect(point[0] - r, point[1] - r, r * 2, r * 2);
          ctx.strokeRect(point[0] - r, point[1] - r, r * 2, r * 2);
        });
      }

      function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function updateCropCursor(x, y) {
        const handle = getCropHandleAt(x, y);
        if (handle) {
          const cursors = {
            nw: 'nwse-resize', se: 'nwse-resize',
            ne: 'nesw-resize', sw: 'nesw-resize',
            n: 'ns-resize', s: 'ns-resize',
            e: 'ew-resize', w: 'ew-resize'
          };
          canvas.style.cursor = cursors[handle];
        } else if (pointInCropRect(x, y)) {
          canvas.style.cursor = 'move';
        } else {
          canvas.style.cursor = 'crosshair';
        }
      }

      function onMouseDown(e) {
        e.preventDefault();
        const coords = getCanvasCoords(e);
        const x = coords.x;
        const y = coords.y;
        const handle = getCropHandleAt(x, y);

        if (handle) {
          cropDragMode = 'resize';
          cropActiveHandle = handle;
          cropStartRect = { x: cropRect.x, y: cropRect.y, w: cropRect.w, h: cropRect.h };
          cropStartPoint = { x: x, y: y };
          return;
        }

        if (pointInCropRect(x, y)) {
          cropDragMode = 'move';
          cropStartRect = { x: cropRect.x, y: cropRect.y, w: cropRect.w, h: cropRect.h };
          cropStartPoint = { x: x, y: y };
          return;
        }

        // 在选区外面按下并拖动：画一个新选区
        cropDragMode = 'create';
        cropStartPoint = { x: x, y: y };
        cropRect = clampCropRect({ x: x, y: y, w: getCropMinSize(), h: getCropMinSize() });
        drawCanvas();
      }

      function onMouseMove(e) {
        const coords = getCanvasCoords(e);
        const x = coords.x;
        const y = coords.y;

        if (!cropDragMode) {
          updateCropCursor(x, y);
          return;
        }

        e.preventDefault();

        if (cropDragMode === 'move') {
          const dx = x - cropStartPoint.x;
          const dy = y - cropStartPoint.y;
          cropRect = clampCropRect({
            x: cropStartRect.x + dx,
            y: cropStartRect.y + dy,
            w: cropStartRect.w,
            h: cropStartRect.h
          });
        } else if (cropDragMode === 'create') {
          cropRect = makeCropRect(cropStartPoint, { x: x, y: y });
        } else if (cropDragMode === 'resize') {
          cropRect = resizeCropRect(cropStartRect, cropActiveHandle, x, y);
        }

        drawCanvas();
      }

      function onMouseUp() {
        if (!cropDragMode) return;

        // 选了比例时，松手后自动吸附到该比例
        const ratio = getCropRatio();
        if (ratio && cropDragMode !== 'move') {
          cropRect = applyCropRatio(cropRect, ratio);
        }
        cropRect = clampCropRect(cropRect);

        cropDragMode = null;
        cropActiveHandle = null;
        cropStartRect = null;
        cropStartPoint = null;
        canvas.style.cursor = 'crosshair';
        drawCanvas();
      }

      cropRatioSelect.addEventListener('change', function() {
        const ratio = getCropRatio();
        if (!ratio) return;
        cropRect = applyCropRatio(cropRect, ratio);
        drawCanvas();
      });

      resetCropBtn.addEventListener('click', function() {
        cropRect = { x: 0, y: 0, w: img.width, h: img.height };
        cropRatioSelect.value = 'free';
        cropDragMode = null;
        cropActiveHandle = null;
        cropStartRect = null;
        cropStartPoint = null;
        canvas.style.cursor = 'crosshair';
        drawCanvas();
      });

      applyCropBtn.addEventListener('click', function() {
        const cropW = Math.max(1, Math.round(cropRect.w));
        const cropH = Math.max(1, Math.round(cropRect.h));
        const cropX = Math.max(0, Math.round(cropRect.x));
        const cropY = Math.max(0, Math.round(cropRect.y));

        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = cropW;
        cropCanvas.height = cropH;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
        
        uploadedBgImageUrl = cropCanvas.toDataURL('image/png');
        
        useBgImageCheckbox.checked = true;
        useBgImage = true;
        activeGradient = null;
        document.querySelectorAll('.gradient-item').forEach(el => el.classList.remove('active'));
        
        img = new Image();
        imgLoaded = false;
        img.onload = function() {
          imgLoaded = true;
          cropRect = { x: 0, y: 0, w: img.width, h: img.height };
          drawPreviewCanvas();
        };
        img.onerror = function() {
          alert('裁剪后的图片加载失败，请重试。');
        };
        img.src = uploadedBgImageUrl;
        
        cropModal.classList.remove('active');
      });

      closeCropModalBtn.addEventListener('click', () => cropModal.classList.remove('active'));
      cancelCropBtn.addEventListener('click', () => cropModal.classList.remove('active'));
      cropModal.addEventListener('click', (e) => { if (e.target === cropModal) cropModal.classList.remove('active'); });

      // 社交链接
      document.querySelectorAll('.social-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const url = this.dataset.url;
          if (url) window.open(url, '_blank');
        });
      });
    })();
  </script>
</body>
</html>
