<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>观月抱云の字体预览工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(145deg, #f4f7fc 0%, #e9eef5 100%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      color: #1e293b;
    }

    .app {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.1),
                  inset 0 1px 2px rgba(255, 255, 255, 0.8);
      width: 100%;
      max-width: 1250px;
      padding: 1.8rem 2rem 2rem;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.8rem;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #1e293b;
      display: flex;
      align-items: center;
    }

    .social-links { display: flex; gap: 0.6rem; flex-wrap: wrap; }

    .social-btn {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      display: inline-flex;
      align-items: center;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .control-group {
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      padding: 1rem 1rem 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.05),
                  inset 0 1px 2px rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .control-group h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 0.8rem;
      font-weight: 500;
    }

    .field { margin-bottom: 0.8rem; display: flex; flex-direction: column; gap: 0.2rem; }
    .field:last-child { margin-bottom: 0; }
    .field label { font-size: 0.7rem; font-weight: 500; color: #475569; letter-spacing: 0.02em; }

    .field input[type="text"],
    .field input[type="file"],
    .field select,
    .field textarea {
      width: 100%;
      padding: 0.5rem 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 1.5rem;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: all 0.2s;
      font-family: inherit;
      color: #1e293b;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.02);
    }

    /* 彻底修复下拉框：使用原生外观，不再搞半透明，保证能点开 */
    .field select {
      appearance: auto !important;
      -webkit-appearance: menulist !important;
      background-color: #ffffff;
      cursor: pointer;
      z-index: 100;
      border-radius: 0.5rem; /* 略微改小圆角，更像原生 */
      padding: 0.5rem;
    }

    .field textarea {
      resize: vertical;
      border-radius: 1rem;
      min-height: 100px;
    }

    .field input[type="text"]:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: #a0b8d0;
      background: rgba(255, 255, 255, 0.75);
    }

    .field input[type="file"] { padding: 0.3rem; font-size: 0.75rem; }
    .field input[type="file"]::file-selector-button {
      padding: 0.3rem 0.8rem;
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      margin-right: 0.6rem;
      transition: background 0.2s;
      font-size: 0.75rem;
    }
    .field input[type="file"]::file-selector-button:hover { background: rgba(255, 255, 255, 0.8); }

    .range-wrapper { display: flex; align-items: center; gap: 0.4rem; }
    .range-btn {
      width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.5); cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #475569; font-weight: 600; transition: all 0.2s; user-select: none; padding-bottom: 1px;
      flex-shrink: 0;
    }
    .range-btn:hover { background: rgba(255,255,255,0.9); }
    .range-wrapper input[type="range"] {
      flex: 1; height: 3px; -webkit-appearance: none;
      background: rgba(0, 0, 0, 0.1); border-radius: 10px; margin: 0 4px;
      min-width: 40px;
    }
    .range-wrapper input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      background: white; border-radius: 50%; border: 2px solid #94a3b8;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1); cursor: pointer;
    }
    .range-value {
      min-width: 2.6rem; text-align: center; font-weight: 500; font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.6); padding: 0.15rem 0.3rem;
      border-radius: 2rem; border: 1px solid rgba(255, 255, 255, 0.8);
      flex-shrink: 0;
    }

    .color-row { display: flex; align-items: center; gap: 0.6rem; }
    .color-row input[type="color"] {
      width: 36px; height: 36px; border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 1rem; padding: 0.15rem; background: rgba(255, 255, 255, 0.4); cursor: pointer;
    }
    .color-hex {
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.6); padding: 0.2rem 0.6rem;
      border-radius: 2rem; border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .checkbox-row {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.75rem; color: #1e293b; cursor: pointer; user-select: none;
    }
    .checkbox-row input[type="checkbox"] { width: 1rem; height: 1rem; accent-color: #94a3b8; cursor: pointer; }

    .font-status {
      background: rgba(255, 255, 255, 0.45); padding: 0.4rem 0.8rem;
      border-radius: 1.5rem; margin-top: 0.3rem; font-size: 0.7rem;
      border: 1px solid rgba(255, 255, 255, 0.8); color: #334155;
    }
    .font-status span { font-weight: 500; color: #0f172a; }

    .btn-small {
      padding: 0.35rem 1rem; font-size: 0.75rem; width: auto;
      background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 2rem; cursor: pointer; transition: all 0.2s;
      color: #1e293b; font-weight: 500; margin-top: 0.3rem;
    }
    .btn-small:hover { background: rgba(255, 255, 255, 0.7); }

    .align-group { display: flex; gap: 0.4rem; margin-top: 0.2rem; }
    .align-btn {
      flex: 1; padding: 0.4rem 0; text-align: center; font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 1rem; cursor: pointer; transition: all 0.2s;
      color: #475569; font-weight: 500;
    }
    .align-btn:hover { background: rgba(255, 255, 255, 0.7); }
    .align-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }

    .collapse-trigger {
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.2rem; padding: 0.2rem 0; user-select: none;
    }
    .collapse-trigger h3 { margin-bottom: 0; }
    .collapse-icon { font-size: 0.7rem; transition: transform 0.3s; color: #64748b; }
    .collapse-content { margin-top: 0.8rem; display: none; width: 100%; }
    .collapse-content.open { display: block; }

    .gradient-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-top: 0.5rem; width: 100%; }
    .gradient-item {
      height: 40px; border-radius: 1rem; cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.8);
      transition: transform 0.2s, border-color 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      position: relative; overflow: hidden;
    }
    .gradient-item:hover { transform: scale(1.02); border-color: #94a3b8; }
    .gradient-item.active { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); }

    .custom-color-group { display: flex; gap: 0.3rem; align-items: center; margin-top: 0.5rem; width: 100%; justify-content: space-between; }
    .custom-color-group input[type="color"] {
      width: 26px; height: 26px; border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 0.6rem; padding: 0.1rem; background: rgba(255, 255, 255, 0.4); cursor: pointer; flex-shrink: 0;
    }

    .color-checkbox-group {
      display: flex; flex-wrap: nowrap; justify-content: space-between; align-items: center;
      margin-top: 0.8rem; font-size: 0.6rem; color: #475569; gap: 0.05rem; width: 100%; overflow: hidden;
    }
    .color-checkbox-group label { display: flex; align-items: center; gap: 0.1rem; cursor: pointer; white-space: nowrap; }
    .color-checkbox-group input[type="checkbox"] { width: 0.7rem; height: 0.7rem; margin: 0; accent-color: #94a3b8; cursor: pointer; flex-shrink: 0; }

    .generate-btn {
      width: 100%; margin-top: 0.8rem; padding: 0.4rem 0; font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 2rem; cursor: pointer; transition: all 0.2s; color: #1e293b; font-weight: 500;
    }
    .generate-btn:hover { background: rgba(255, 255, 255, 0.7); }

    .preview-area { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
    .preview-container {
      background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-radius: 2rem; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 15px 35px -12px rgba(0, 0, 0, 0.1), inset 0 1px 4px rgba(255, 255, 255, 0.8);
      padding: 1.2rem; width: 100%; max-width: 550px;
    }

    .preview-canvas-wrap {
      position: relative; width: 100%; aspect-ratio: 1 / 1; 
      display: flex; align-items: center; justify-content: center;
      background: #ffffff; border-radius: 1.5rem; overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.02);
    }
    
    #mainPreviewCanvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .download-group {
      display: flex; flex-direction: column; gap: 0.6rem; width: 100%; max-width: 550px;
    }
    .download-options {
      display: flex; gap: 1rem; justify-content: center; align-items: center;
      font-size: 0.8rem; color: #475569;
    }
    .download-options label { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
      padding: 0.85rem 2rem; border-radius: 3rem; font-weight: 500; font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.8); cursor: pointer; transition: all 0.2s;
      background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: #1e293b; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      letter-spacing: 0.02em; width: 100%;
    }
    .btn.btn-primary { background: #1e293b; color: white; border-color: #1e293b; }
    .btn.btn-primary:hover { background: #0f172a; }
    .btn:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-2px); box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.9); }

    .btn.saving { background: #94a3b8 !important; color: white !important; cursor: wait; }
    .btn.saved { background: #10b981 !important; color: white !important; border-color: #10b981 !important; }

    .footnote { font-size: 0.7rem; color: #94a3b8; text-align: center; margin-top: 0.2rem; }

    .save-settings-btn {
      background: #3b82f6; color: white; border: none; padding: 0.4rem 1rem; border-radius: 2rem;
      cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: background 0.2s;
    }
    .save-settings-btn:hover { background: #2563eb; }
    .save-hint {
      font-size: 0.65rem; color: #ef4444; margin-top: 0.2rem; display: none;
    }
    
    .path-btn {
      background: #10b981; color: white; border: none; padding: 0.4rem 1rem; border-radius: 2rem;
      cursor: pointer; font-size: 0.8rem; font-weight: 500; transition: background 0.2s;
      display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .path-btn:hover { background: #059669; }
    .path-status { font-size: 0.7rem; color: #64748b; margin-left: 0.5rem; }

    .text-preset-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .text-preset-actions .btn-small {
      margin-top: 0;
      width: 100%;
      white-space: normal;
      line-height: 1.2;
      padding: 0.4rem 0.2rem;
    }
    .preset-source {
      font-size: 0.65rem; color: #64748b; line-height: 1.4; margin-top: 0.55rem;
      word-break: break-all;
    }

    /* 文案库自定义下拉框（不依赖浏览器原生弹层，避免空白色块/被毛玻璃遮住） */
    .preset-select { position: relative; width: 100%; }
    .preset-trigger {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
      padding: 0.55rem 0.9rem; border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: 0.75rem; background: #ffffff; color: #1e293b;
      font-family: inherit; font-size: 0.85rem; line-height: 1.4; text-align: left;
      cursor: pointer; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .preset-trigger:hover { border-color: #94a3b8; }
    .preset-trigger:focus-visible {
      outline: none; border-color: #64748b; box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.16);
    }
    .preset-trigger:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }
    .preset-select.open .preset-trigger {
      border-color: #64748b; box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.16);
    }
    .preset-trigger-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preset-arrow { flex-shrink: 0; font-size: 0.7rem; color: #64748b; transition: transform 0.2s; }
    .preset-select.open .preset-arrow { transform: rotate(180deg); }

    .preset-menu {
      position: absolute; z-index: 1200; left: 0; right: 0; top: calc(100% + 6px);
      display: none; max-height: 260px; overflow-y: auto; padding: 0.3rem;
      background: #ffffff; border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0.9rem; box-shadow: 0 18px 40px -12px rgba(15, 23, 42, 0.3);
    }
    .preset-select.open .preset-menu { display: block; }
    /* 展开时把整张卡片抬到上层，避免被下方“当前预览文字”卡片盖住 */
    .control-group.preset-menu-open { position: relative; z-index: 60; }
    .preset-option {
      display: flex; align-items: center; gap: 0.5rem; width: 100%;
      padding: 0.5rem 0.7rem; border: 0; border-radius: 0.6rem;
      background: transparent; color: #334155; font-family: inherit; font-size: 0.82rem;
      line-height: 1.35; text-align: left; cursor: pointer; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .preset-option:hover { background: #f1f5f9; }
    .preset-option.active { background: #e2e8f0; color: #0f172a; font-weight: 600; }
    .preset-option-name { overflow: hidden; text-overflow: ellipsis; }
    .preset-option-check { margin-left: auto; flex-shrink: 0; color: #3b82f6; opacity: 0; }
    .preset-option.active .preset-option-check { opacity: 1; }
    #textPresetSelect { display: none !important; }

    .toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: #10b981; color: white; padding: 0.75rem 2rem; border-radius: 2rem;
      font-size: 0.9rem; font-weight: 500; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
      opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 9999;
      display: flex; align-items: center; gap: 0.5rem; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #ffffff; border-radius: 2rem; padding: 1.5rem;
      width: 90%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-header h2 { font-size: 1.2rem; font-weight: 600; color: #1e293b; }
    .modal-close {
      background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;
      padding: 0.2rem 0.5rem; border-radius: 0.5rem; transition: background 0.2s;
    }
    .modal-close:hover { background: rgba(0, 0, 0, 0.05); }

    .cropper-wrapper {
      position: relative; width: 100%; height: 500px; background: #1e293b;
      border-radius: 1rem; overflow: hidden; display: flex; align-items: center; justify-content: center;
      margin-bottom: 1rem;
    }
    .cropper-wrapper canvas { max-width: 100%; max-height: 100%; display: block; cursor: crosshair; }

    .crop-controls { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .crop-controls label { font-size: 0.8rem; font-weight: 500; color: #475569; }
    .crop-controls select, .crop-controls input { padding: 0.5rem 0.8rem; border: 1px solid #cbd5e1; border-radius: 2rem; font-size: 0.85rem; }

    .modal-footer { display: flex; gap: 1rem; justify-content: flex-end; }
    .modal-footer button {
      padding: 0.7rem 1.5rem; border-radius: 2rem; font-weight: 500; cursor: pointer;
      border: 1px solid #cbd5e1; background: #ffffff; color: #1e293b; transition: all 0.2s;
    }
    .modal-footer button.primary { background: #0f172a; color: #ffffff; border-color: #0f172a; }
    .modal-footer button.primary:hover { background: #1e293b; }
    .modal-footer button:hover { background: #f1f5f9; }

    @media (max-width: 900px) {
      .header { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 600px) {
      .app { padding: 1.2rem; }
      .controls-grid { grid-template-columns: 1fr; }
      .cropper-wrapper { height: 300px; }
      .download-group { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast">✅ 操作成功</div>

  <div class="app">
    <div class="header">
      <div style="display:flex; flex-direction:column; gap:0.5rem;">
        <h1>观月抱云の字体预览工具</h1>
        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
          <button class="save-settings-btn" id="saveSettingsBtn">保存当前设置</button>
          <span class="save-hint" id="saveHint">设置已保存（清理浏览器缓存会丢失）</span>
          
          <button class="path-btn" id="chooseSavePathBtn">设定下载文件夹</button>
          <span class="path-status" id="pathStatus">未选择文件夹</span>
        </div>
      </div>
      <div class="social-links">
        <button class="social-btn" data-url="https://xhslink.cn/o/4vKg7Z4neNC" data-name="小红书">小红书</button>

  <!-- 文案数据：所有文案内容都在同目录的 fengmian.json 里，页面启动时自动读取 -->
  <script>
    (function() {
      // --- DOM 获取 ---
      const fontFileInput = document.getElementById('fontFileInput');

      // 文案库相关 DOM
      const textPresetSelect = document.getElementById('textPresetSelect');

      const textPresetTrigger = document.getElementById('textPresetTrigger');
      const textPresetLabel = document.getElementById('textPresetLabel');
      const textPresetMenu = document.getElementById('textPresetMenu');
      const presetSourceHint = document.getElementById('presetSourceHint');
      const resetTextPresetsBtn = document.getElementById('resetTextPresetsBtn');
      const saveTextPresetBtn = document.getElementById('saveTextPresetBtn');
      const deleteTextPresetBtn = document.getElementById('deleteTextPresetBtn');
      const exportTextBtn = document.getElementById('exportTextBtn');
      const importTextBtn = document.getElementById('importTextBtn');
      const importFileInput = document.getElementById('importFileInput');
      
      const previewCanvasWrap = document.getElementById('previewCanvasWrap');
      const mainCanvas = document.getElementById('mainPreviewCanvas');
      const ctxMain = mainCanvas.getContext('2d');

      const commercialSelect = document.getElementById('commercialSelect');
      const downloadSquareBtn = document.getElementById('downloadSquareBtn');
      const downloadRoundBtn = document.getElementById('downloadRoundBtn');
      const toastEl = document.getElementById('toast');

      const alignBtns = document.querySelectorAll('.align-btn');
      const titleFirstLineCheckbox = document.getElementById('titleFirstLineCheckbox');
      
      const gradientCollapseTrigger = document.getElementById('gradientCollapseTrigger');
      const gradientCollapseContent = document.getElementById('gradientCollapseContent');
      const gradientCollapseIcon = document.getElementById('gradientCollapseIcon');
      const gradientGrid = document.getElementById('gradientGrid');
      const customColor1 = document.getElementById('customColor1');
      const customColor2 = document.getElementById('customColor2');
      const customColor3 = document.getElementById('customColor3');
      const customColor4 = document.getElementById('customColor4');
      const customColor5 = document.getElementById('customColor5');
      
      const useColor1 = document.getElementById('useColor1');
      const useColor2 = document.getElementById('useColor2');
      const useColor3 = document.getElementById('useColor3');
      const useColor4 = document.getElementById('useColor4');
      const useColor5 = document.getElementById('useColor5');
      
      const generateCustomGradientBtn = document.getElementById('generateCustomGradientBtn');

      const cropModal = document.getElementById('cropModal');
      const cropperWrapper = document.getElementById('cropperWrapper');
      const closeCropModalBtn = document.getElementById('closeCropModalBtn');
      const cancelCropBtn = document.getElementById('cancelCropBtn');
      const applyCropBtn = document.getElementById('applyCropBtn');
      const cropRatioSelect = document.getElementById('cropRatioSelect');
      const resetCropBtn = document.getElementById('resetCropBtn');
      
      const saveSettingsBtn = document.getElementById('saveSettingsBtn');
      const saveHint = document.getElementById('saveHint');
      const chooseSavePathBtn = document.getElementById('chooseSavePathBtn');
      const pathStatus = document.getElementById('pathStatus');

      // --- 状态变量 ---
      const DEFAULT_FONT_FAMILY = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
      let currentFontFamily = DEFAULT_FONT_FAMILY;
      let currentFontDisplayName = '系统默认';
      let uploadedFontUrl = null;
      let uploadedFontBase64 = null;
      let uploadedBgImageUrl = null;
      let useBgImage = true;
      let activeGradient = null;
      let currentAlign = 'center';

      let canvas, ctx;
      let img = new Image();
      let imgLoaded = false;
      let cropRect = { x: 0, y: 0, w: 0, h: 0 };
      let cropDragMode = null;      // 'move' | 'create' | 'resize'
      let cropActiveHandle = null;  // nw/n/ne/e/se/s/sw/w
      let cropStartRect = null;
      let cropStartPoint = null;
      
      let saveDirectoryHandle = null;

      // 晕染背景预设数据（之前缺失，导致脚本初始化中断、文案下拉框空白）
      const gradientPresets = [
        { name: '樱雾', cx: '28%', cy: '28%', colors: ['#fde2e4', '#fbcfe8', '#fff1f2'] },
        { name: '海盐', cx: '72%', cy: '30%', colors: ['#c1dfe8', '#bae6fd', '#eff6ff'] },
        { name: '柠檬苏打', cx: '30%', cy: '72%', colors: ['#fef3c7', '#fde68a', '#fffbeb'] },
        { name: '薰衣草', cx: '70%', cy: '68%', colors: ['#e9d5ff', '#d8b4fe', '#f5f3ff'] },
        { name: '薄荷', cx: '25%', cy: '35%', colors: ['#d1fae5', '#a7f3d0', '#ecfdf5'] },
        { name: '晚霞', cx: '75%', cy: '25%', colors: ['#fecdd3', '#fdba74', '#fff7ed'] },
        { name: '雾蓝', cx: '50%', cy: '20%', colors: ['#e2e8f0', '#cbd5e1', '#f8fafc'] },
        { name: '奶油', cx: '40%', cy: '60%', colors: ['#fef9c3', '#fde2e4', '#fefce8'] }
      ];

      // ===== 文案库数据 =====
      // 所有文案内容都在同目录的 fengmian.json 里，HTML 不写文案内容。
      // 页面启动时用 fetch 读取；如果读取失败，这里保持空数组并在页面上提示。
      let FILE_TEXT_PRESETS = [];

      // 页面里做的修改单独保存，不会覆盖 fengmian.json 的新内容
      const CUSTOM_PRESETS_KEY = 'fontPreviewCustomPresets';       // 新增的自定义文案
      const PRESET_OVERRIDES_KEY = 'fontPreviewPresetOverrides';   // 覆盖了文件里的某条文案
      const DELETED_PRESETS_KEY = 'fontPreviewDeletedPresets';     // 删除了文件里的某条文案
      const FILE_SIGNATURE_KEY = 'fontPreviewFileSignature';       // 判断 fengmian.json 是否改过
      const LEGACY_PRESETS_KEY = 'fontPreviewTextPresets';         // 旧版本使用的存储 key

      let textPresets = [];

      const PREVIEW_SIZE = 1500; 
      mainCanvas.width = PREVIEW_SIZE;
      mainCanvas.height = PREVIEW_SIZE;
      const BASE_SIZE = 500; 

      // --- 初始化与辅助函数 ---
      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2500);
      }

      function getGradientCss(preset) {
        return `radial-gradient(circle at ${preset.cx} ${preset.cy}, ${preset.colors[0]}, ${preset.colors[1]}, ${preset.colors[2]})`;
      }

      // --- 文案库：读取 fengmian.json + 合并本地修改 ---
      function readJsonStorage(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          return parsed === null || parsed === undefined ? fallback : parsed;
        } catch (e) {
          return fallback;
        }
      }

      function writeJsonStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
          alert('文案库保存失败：浏览器本地存储空间不足或被禁用。');
        }
      }

      function isValidPreset(p) {
        return !!p && typeof p.name === 'string' && typeof p.content === 'string';
      }

      function getFilePresetNames() {
        return new Set(FILE_TEXT_PRESETS.map(function(p) { return p.name; }));
      }

      function getCustomPresets() {
        const arr = readJsonStorage(CUSTOM_PRESETS_KEY, []);
        if (!Array.isArray(arr)) return [];
        return arr.filter(isValidPreset).map(function(p) {
          return { name: p.name, content: p.content };
        });
      }

      function getPresetOverrides() {
        const obj = readJsonStorage(PRESET_OVERRIDES_KEY, {});
        return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
      }

      function getDeletedPresetNames() {
        const arr = readJsonStorage(DELETED_PRESETS_KEY, []);
        if (!Array.isArray(arr)) return [];
        return arr.filter(function(n) { return typeof n === 'string'; });
      }

      // 旧版本把整份文案列表存在 fontPreviewTextPresets 里。
      // 这里只迁移“文件里没有的自定义文案”，文件里的文案以 fengmian.json 为准。
      function migrateLegacyPresets() {
        const legacy = readJsonStorage(LEGACY_PRESETS_KEY, null);
        if (!Array.isArray(legacy)) return;

        const fileNames = getFilePresetNames();
        const custom = getCustomPresets();

        legacy.forEach(function(p) {
          if (!isValidPreset(p)) return;
          if (fileNames.has(p.name)) return;
          if (custom.some(function(c) { return c.name === p.name; })) return;
          custom.push({ name: p.name, content: p.content });
        });

        writeJsonStorage(CUSTOM_PRESETS_KEY, custom);
        try { localStorage.removeItem(LEGACY_PRESETS_KEY); } catch (e) {}
      }

      // fengmian.json 内容一变，就清掉针对文件文案的覆盖/删除记录，让新文案直接生效。
      // 只新增/修改自定义文案时文件签名不变，本地记录会保留。
      function syncFileSignature() {
        const signature = JSON.stringify(FILE_TEXT_PRESETS);
        let last = null;
        try { last = localStorage.getItem(FILE_SIGNATURE_KEY); } catch (e) {}
        if (last === signature) return;
        try {
          localStorage.removeItem(PRESET_OVERRIDES_KEY);
          localStorage.removeItem(DELETED_PRESETS_KEY);
          localStorage.setItem(FILE_SIGNATURE_KEY, signature);
        } catch (e) {}
      }

      // 合并顺序：fengmian.json 文件 → 本地覆盖 → 本地新增 → 本地删除
      function buildPresetList() {
        const overrides = getPresetOverrides();
        const deleted = new Set(getDeletedPresetNames());
        const fileNames = getFilePresetNames();
        const result = [];
        const indexByName = new Map();

        FILE_TEXT_PRESETS.forEach(function(p) {
          if (deleted.has(p.name)) return;
          const content = Object.prototype.hasOwnProperty.call(overrides, p.name)
            ? String(overrides[p.name])
            : p.content;
          indexByName.set(p.name, result.length);
          result.push({ name: p.name, content: content });
        });

        getCustomPresets().forEach(function(p) {
          if (fileNames.has(p.name) || deleted.has(p.name)) return;
          if (indexByName.has(p.name)) {
            result[indexByName.get(p.name)].content = p.content;
          } else {
            indexByName.set(p.name, result.length);
            result.push({ name: p.name, content: p.content });
          }
        });

        return result;
      }

      // 从同目录的 fengmian.json 读取文案数据。
      // 加时间参数是为了避开 GitHub Pages 的缓存，让每次刷新都能拿到最新 JSON。
      async function loadPresetFile() {
        const response = await fetch('./fengmian.json?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('JSON 顶层不是数组');

        const cleaned = data.filter(isValidPreset).map(function(p) {
          return { name: p.name, content: p.content };
        });
        if (cleaned.length === 0 && data.length > 0) {
          throw new Error('数组里没有有效的 name / content 字段');
        }
        return cleaned;
      }

      async function initTextPresets() {
        try {
          FILE_TEXT_PRESETS = await loadPresetFile();
          syncFileSignature();
          migrateLegacyPresets();

          presetSourceHint.textContent = FILE_TEXT_PRESETS.length > 0
            ? '文案来自 fengmian.json（文件内 ' + FILE_TEXT_PRESETS.length + ' 条）'
            : 'fengmian.json 里还没有文案';
          presetSourceHint.style.color = FILE_TEXT_PRESETS.length > 0 ? '' : '#d97706';
        } catch (err) {
          console.error('读取 fengmian.json 失败:', err);
          presetSourceHint.textContent = location.protocol === 'file:'
            ? '本地双击打开时浏览器不允许读取 fengmian.json，请用网站地址访问'
            : '没有读到 fengmian.json，请检查它是否和 index.html 在同一个文件夹';
          presetSourceHint.style.color = '#dc2626';
        }

        textPresets = buildPresetList();
        renderTextPresets(0);
      }

      function renderTextPresets(preferredIndex) {
        textPresetSelect.innerHTML = '';
        textPresetMenu.innerHTML = '';

        textPresets.forEach(function(preset, index) {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = preset.name;
          textPresetSelect.appendChild(option);

          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'preset-option';
          item.dataset.index = index;
          item.setAttribute('role', 'option');
          item.setAttribute('aria-selected', 'false');

          const nameSpan = document.createElement('span');
          nameSpan.className = 'preset-option-name';
          nameSpan.textContent = preset.name;

          const checkSpan = document.createElement('span');
          checkSpan.className = 'preset-option-check';
          checkSpan.textContent = '✓';

          item.appendChild(nameSpan);
          item.appendChild(checkSpan);
          item.addEventListener('click', function() {
            applyTextPreset(index);
            closeTextPresetMenu();
          });
          textPresetMenu.appendChild(item);
        });

        let index = 0;
        if (typeof preferredIndex === 'number' && textPresets[preferredIndex]) {
          index = preferredIndex;
        } else if (textPresets.length === 0) {
          index = -1;
        }
        syncTextPresetUI(index);
      }

      function syncTextPresetUI(index) {
        const valid = index >= 0 && index < textPresets.length;
        textPresetSelect.value = valid ? String(index) : '';
        textPresetLabel.textContent = valid
          ? textPresets[index].name
          : (textPresets.length > 0 ? '请选择文案' : '暂无文案');
        textPresetTrigger.disabled = textPresets.length === 0;

        textPresetMenu.querySelectorAll('.preset-option').forEach(function(el) {
          const isActive = valid && Number(el.dataset.index) === index;
          el.classList.toggle('active', isActive);
          el.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
      }

      function applyTextPreset(index) {
        if (!textPresets[index]) return;
        syncTextPresetUI(index);
        previewTextInput.value = textPresets[index].content;
        drawPreviewCanvas();
      }

      function openTextPresetMenu() {
        if (textPresets.length === 0) return;
        textPresetSelectBox.classList.add('open');
        textPresetTrigger.setAttribute('aria-expanded', 'true');
        const group = textPresetSelectBox.closest('.control-group');
        if (group) group.classList.add('preset-menu-open');
        const active = textPresetMenu.querySelector('.preset-option.active');
        if (active) active.scrollIntoView({ block: 'nearest' });
      }

      function closeTextPresetMenu() {
        textPresetSelectBox.classList.remove('open');
        textPresetTrigger.setAttribute('aria-expanded', 'false');
        const group = textPresetSelectBox.closest('.control-group');
        if (group) group.classList.remove('preset-menu-open');
      }

      // 保存一条文案：文件里已有的名字记为“覆盖”，没有的记为“自定义”
      function savePresetToStorage(name, content) {
        if (getFilePresetNames().has(name)) {
          const overrides = getPresetOverrides();
          overrides[name] = content;
          writeJsonStorage(PRESET_OVERRIDES_KEY, overrides);
        } else {
          const custom = getCustomPresets();
          const idx = custom.findIndex(function(p) { return p.name === name; });
          if (idx !== -1) custom[idx].content = content;
          else custom.push({ name: name, content: content });
          writeJsonStorage(CUSTOM_PRESETS_KEY, custom);
        }

        // 保存说明这条文案不再处于“已删除”状态
        const deleted = getDeletedPresetNames().filter(function(n) { return n !== name; });
        writeJsonStorage(DELETED_PRESETS_KEY, deleted);
      }

      function removePresetFromStorage(name) {
        if (getFilePresetNames().has(name)) {
          const deleted = getDeletedPresetNames();
          if (deleted.indexOf(name) === -1) deleted.push(name);
          writeJsonStorage(DELETED_PRESETS_KEY, deleted);

          const overrides = getPresetOverrides();
          delete overrides[name];
          writeJsonStorage(PRESET_OVERRIDES_KEY, overrides);
        } else {
          const custom = getCustomPresets().filter(function(p) { return p.name !== name; });
          writeJsonStorage(CUSTOM_PRESETS_KEY, custom);
        }
      }

      // 点击下拉框展开/收起
      textPresetTrigger.addEventListener('click', function(e) {
        e.stopPropagation();
        if (textPresetSelectBox.classList.contains('open')) {
          closeTextPresetMenu();
        } else {
          openTextPresetMenu();
        }
      });

      // 点击页面其他地方收起
      document.addEventListener('click', function(e) {
        if (!textPresetSelectBox.contains(e.target)) closeTextPresetMenu();
      });

      // 按 Esc 收起
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeTextPresetMenu();
      });

      // 保存/覆盖当前文案
      saveTextPresetBtn.addEventListener('click', function() {
        const content = previewTextInput.value.trim();
        if (!content) return alert('当前文案为空，无法保存');

        const currentIdx = parseInt(textPresetSelect.value, 10);
        const currentPreset = (!isNaN(currentIdx) && textPresets[currentIdx]) ? textPresets[currentIdx] : null;

        let name = prompt('请为这段文案命名（若名字已存在，将覆盖原有文案）：',
          currentPreset ? currentPreset.name : `新文案_${new Date().toLocaleTimeString()}`
        );

        if (name === null) return;
        name = name.trim();
        if (!name) return alert('文案名称不能为空');

        const existingIdx = textPresets.findIndex(function(p) { return p.name === name; });
        if (existingIdx !== -1) {
          textPresets[existingIdx].content = content;
        } else {
          textPresets.push({ name: name, content: content });
        }

        savePresetToStorage(name, content);
        renderTextPresets(existingIdx !== -1 ? existingIdx : textPresets.length - 1);
        closeTextPresetMenu();
        showToast('✅ 文案已保存到库');
      });

      // 删除当前文案
      deleteTextPresetBtn.addEventListener('click', function() {
        const idx = parseInt(textPresetSelect.value, 10);
        if (isNaN(idx) || !textPresets[idx]) {
          return alert('请先在下拉框中选择要删除的文案');
        }

        const preset = textPresets[idx];
        if (!confirm(`确定要删除文案“${preset.name}”吗？`)) return;

        textPresets.splice(idx, 1);
        removePresetFromStorage(preset.name);
        renderTextPresets(0);
        closeTextPresetMenu();
        if (textPresets.length > 0) {
          applyTextPreset(0);
        } else {
          previewTextInput.value = '';
          drawPreviewCanvas();
        }
        showToast('✅ 文案已删除');
      });

      // 导出文案库（导出的是合并后的完整列表，可当作 fengmian.json 的数据源）
      exportTextBtn.addEventListener('click', function() {
        const dataStr = JSON.stringify(textPresets, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `文案库备份_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('✅ 文案库已导出');
      });

      // 导入文案库：同名覆盖，不同名追加，不会产生重复项
      importTextBtn.addEventListener('click', function() {
        importFileInput.click();
      });

      importFileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
          try {
            const importedData = JSON.parse(event.target.result);
            if (!Array.isArray(importedData)) {
              alert('导入文件格式不正确，应为 JSON 数组');
              return;
            }

            const cleanData = importedData.filter(isValidPreset);
            if (cleanData.length === 0) {
              alert('导入的文案库为空，或数据格式不正确（需要 name / content 字段）');
              return;
            }

            const fileNames = getFilePresetNames();
            const overrides = getPresetOverrides();
            const custom = getCustomPresets();
            const deleted = new Set(getDeletedPresetNames());

            cleanData.forEach(function(p) {
              deleted.delete(p.name);
              if (fileNames.has(p.name)) {
                overrides[p.name] = p.content;
              } else {
                const idx = custom.findIndex(function(c) { return c.name === p.name; });
                if (idx !== -1) custom[idx].content = p.content;
                else custom.push({ name: p.name, content: p.content });
              }
            });

            writeJsonStorage(PRESET_OVERRIDES_KEY, overrides);
            writeJsonStorage(CUSTOM_PRESETS_KEY, custom);
            writeJsonStorage(DELETED_PRESETS_KEY, Array.from(deleted));

            textPresets = buildPresetList();
            const firstIndex = textPresets.findIndex(function(p) { return p.name === cleanData[0].name; });
            renderTextPresets(firstIndex);
            closeTextPresetMenu();
            showToast('✅ 文案库导入成功');
          } catch (err) {
            alert('导入失败：文件不是有效的 JSON');
          }
        };
        reader.readAsText(file);
        importFileInput.value = '';
      });

      // 清除页面里对文件文案的覆盖/删除，重新以 fengmian.json 为准
      resetTextPresetsBtn.addEventListener('click', function() {
        if (!confirm('恢复为 fengmian.json 里的文案？\n\n页面里对文件文案的覆盖和删除会被清除；你自己新增的自定义文案会保留。')) return;

        try {
          localStorage.removeItem(PRESET_OVERRIDES_KEY);
          localStorage.removeItem(DELETED_PRESETS_KEY);
          localStorage.setItem(FILE_SIGNATURE_KEY, JSON.stringify(FILE_TEXT_PRESETS));
        } catch (e) {}

        textPresets = buildPresetList();
        renderTextPresets(0);
        closeTextPresetMenu();
        if (textPresets.length > 0) {
          applyTextPreset(0);
        } else {
          previewTextInput.value = '';
          drawPreviewCanvas();
        }
        showToast('✅ 已恢复 fengmian.json 的文案');
      });

      // --- Canvas 核心渲染 ---
      // 画布跟随背景图比例；限制在 1:2 ~ 2:1，避免极端长图/宽图把文字挤没
      function syncCanvasSizeToBackground() {
        let targetW = PREVIEW_SIZE;
        let targetH = PREVIEW_SIZE;

        if (useBgImage && imgLoaded && img.width > 0 && img.height > 0) {
          const ratio = Math.max(0.5, Math.min(2, img.width / img.height));
          if (ratio >= 1) {
            targetW = PREVIEW_SIZE;
            targetH = Math.round(PREVIEW_SIZE / ratio);
          } else {
            targetH = PREVIEW_SIZE;
            targetW = Math.round(PREVIEW_SIZE * ratio);
          }
        }

        if (mainCanvas.width !== targetW || mainCanvas.height !== targetH) {
          mainCanvas.width = targetW;
          mainCanvas.height = targetH;
        }
      }

      async function drawPreviewCanvas() {
        if (!ctxMain) return;
        
        try {
          await document.fonts.load(`16px ${currentFontFamily}`);
        } catch(e) {}

        syncCanvasSizeToBackground();
        const width = mainCanvas.width;
        const height = mainCanvas.height;

        // 1. 背景
        ctxMain.clearRect(0, 0, width, height);
        ctxMain.fillStyle = '#f8fafc';
        ctxMain.fillRect(0, 0, width, height);

        if (useBgImage && uploadedBgImageUrl && imgLoaded) {
          const imgRatio = img.width / img.height;
          const canvasRatio = width / height;
          let drawW, drawH, offsetX, offsetY;
          if (imgRatio > canvasRatio) {
            drawH = height;
            drawW = img.width * (height / img.height);
            offsetX = (width - drawW) / 2;
            offsetY = 0;
          } else {
            drawW = width;
            drawH = img.height * (width / img.width);
            offsetX = 0;
            offsetY = (height - drawH) / 2;
          }
          ctxMain.drawImage(img, offsetX, offsetY, drawW, drawH);
        } else if (activeGradient) {
          ctxMain.fillStyle = '#ffffff';
          ctxMain.fillRect(0, 0, width, height);

          if (activeGradient.type === 'preset') {
            const preset = activeGradient.data;
            const cx = (parseFloat(preset.cx) / 100) * width;
            const cy = (parseFloat(preset.cy) / 100) * height;
            
            ctxMain.fillStyle = preset.colors[2];
            ctxMain.fillRect(0, 0, width, height);
            
            const grd1 = ctxMain.createRadialGradient(cx, cy, 0, cx, cy, Math.max(width, height) * 1.2);
            grd1.addColorStop(0, preset.colors[0]);
            grd1.addColorStop(0.6, preset.colors[1]);
            grd1.addColorStop(1, 'rgba(255,255,255,0)');
            ctxMain.fillStyle = grd1;
            ctxMain.fillRect(0, 0, width, height);
          } else if (activeGradient.type === 'custom') {
            ctxMain.fillStyle = activeGradient.fallbackColor;
            ctxMain.fillRect(0, 0, width, height);
            if (activeGradient.layers) {
               activeGradient.layers.forEach(layer => {
                 if (layer.color) {
                   const cx = layer.x * width;
                   const cy = layer.y * height;
                   const grd = ctxMain.createRadialGradient(cx, cy, 0, cx, cy, Math.max(width, height) * 0.6);
                   grd.addColorStop(0, layer.color);
                   grd.addColorStop(1, 'rgba(255,255,255,0)');
                   ctxMain.fillStyle = grd;
                   ctxMain.fillRect(0, 0, width, height);
                 }
               });
            }
          }
        }

        // 2. 预计算文本
        const rawText = previewTextInput.value;
        const baseSize = parseInt(fontSizeRange.value) * (width / BASE_SIZE); 
        const align = currentAlign;
        const paddingX = 40 * (width / BASE_SIZE);
        const lineHeight = 1.6;
        const textMaxWidth = width - paddingX * 2;

        const renderLines = [];
        let textTotalHeight = 0;

        const prepareText = (text, size, weight) => {
          ctxMain.font = `${weight} ${size}px ${currentFontFamily}`;
          const paragraphs = text.split('\n');
          
          for (let p = 0; p < paragraphs.length; p++) {
            const paraText = paragraphs[p];
            if (paraText === '') {
              renderLines.push({ text: '', x: 0, y: 0, size, weight });
              textTotalHeight += size * lineHeight;
              continue;
            }

            const chars = paraText.split('');
            let line = '';
            
            for (let n = 0; n < chars.length; n++) {
              const testLine = line + chars[n];
              const testWidth = ctxMain.measureText(testLine).width;
              
              if (testWidth > textMaxWidth && n > 0) {
                renderLines.push({ text: line, size, weight });
                textTotalHeight += size * lineHeight;
                line = chars[n];
              } else {
                line = testLine;
              }
            }
            if (line) {
              renderLines.push({ text: line, size, weight });
              textTotalHeight += size * lineHeight;
            }
          }
        };

        if (titleFirstLineCheckbox.checked) {
          const lines = rawText.split('\n');
          const title = lines[0] || '';
          const content = lines.slice(1).join('\n');
          const titleSize = baseSize * 1.25;
          
          prepareText(title, titleSize, '700');
          if (content) {
            renderLines.push({ text: '', size: baseSize * 0.3, weight: '400' });
            textTotalHeight += baseSize * 0.3;
            prepareText(content, baseSize, '400');
          }
        } else {
          prepareText(rawText, baseSize, '400');
        }

        // 3. 居中算法
        const tagMarginBottom = 24 * (width / BASE_SIZE);
        const tagFontSize = Math.round(11 * (width / BASE_SIZE));
        ctxMain.font = `500 ${tagFontSize}px system-ui, -apple-system, sans-serif`;
        let tagText = bgSourceInput.value.trim() ? `底图来源：${bgSourceInput.value.trim()}` : '';
        
        // 检查商用授权，如果是“未知”则隐藏
        const commercialVal = commercialSelect.value;
        if (commercialVal !== '未知') {
          if (tagText) tagText += ' · ';
          tagText += `${commercialVal}`;
        }
        
        if (tagText) {
          tagText += ` · 字体：${currentFontDisplayName}`;
        } else {
          tagText = `字体：${currentFontDisplayName}`;
        }

        const textMetrics = ctxMain.measureText(tagText);
        const tagPaddingX = 20 * (width / BASE_SIZE);
        const tagPaddingY = 6 * (width / BASE_SIZE);
        const tagH = tagFontSize + tagPaddingY * 2;
        const tagW = textMetrics.width + tagPaddingX * 2;
        
        const topOffset = 40 * (width / BASE_SIZE);
        const bottomOffset = tagH + tagMarginBottom + 20 * (width / BASE_SIZE);
        const availableHeight = height - topOffset - bottomOffset;

        let startY = topOffset;
        if (textTotalHeight < availableHeight) {
          startY = topOffset + (availableHeight - textTotalHeight) / 2;
        }

        // 4. 绘制文字
        const textColor = textColorPicker.value;
        const strokeSize = parseFloat(strokeSizeRange.value) * (width / BASE_SIZE);
        const strokeColor = strokeColorPicker.value;

        const shadowSize = parseFloat(shadowSizeRange.value) * (width / BASE_SIZE);
        const shadowColor = shadowColorPicker.value;

        ctxMain.lineJoin = 'round';
        ctxMain.textBaseline = 'top';
        
        let currentY = startY;
        let x = paddingX;
        if (align === 'center') {
          x = width / 2;
          ctxMain.textAlign = 'center';
        } else if (align === 'right') {
          x = width - paddingX;
          ctxMain.textAlign = 'right';
        } else {
          x = paddingX;
          ctxMain.textAlign = 'left';
        }

        renderLines.forEach(item => {
          if (item.text) {
            ctxMain.font = `${item.weight} ${item.size}px ${currentFontFamily}`;
            
            // 处理阴影
            if (shadowSize > 0) {
              ctxMain.shadowColor = shadowColor;
              ctxMain.shadowBlur = 0;
              ctxMain.shadowOffsetX = shadowSize * 1.5;
              ctxMain.shadowOffsetY = shadowSize * 1.5;
            } else {
              ctxMain.shadowColor = 'transparent';
            }

            // 先画描边（如果有）
            if (strokeSize > 0) {
              ctxMain.strokeStyle = strokeColor;
              ctxMain.lineWidth = strokeSize * 2;
              ctxMain.strokeText(item.text, x, currentY);
            }
            
            // 再画填充色
            ctxMain.fillStyle = textColor;
            ctxMain.fillText(item.text, x, currentY);
            
            // 重置阴影，防止污染底部标签
            ctxMain.shadowColor = 'transparent';
          }
          currentY += item.size * lineHeight;
        });

        // 5. 底部标签
        const tagX = (width - tagW) / 2;
        const tagY = height - tagH - tagMarginBottom;

        ctxMain.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctxMain.beginPath();
        if (ctxMain.roundRect) {
          ctxMain.roundRect(tagX, tagY, tagW, tagH, tagH / 2);
        } else {
          ctxMain.moveTo(tagX + tagH/2, tagY);
          ctxMain.lineTo(tagX + tagW - tagH/2, tagY);
          ctxMain.quadraticCurveTo(tagX + tagW, tagY, tagX + tagW, tagY + tagH/2);
          ctxMain.lineTo(tagX + tagW, tagY + tagH - tagH/2);
          ctxMain.quadraticCurveTo(tagX + tagW, tagY + tagH, tagX + tagW - tagH/2, tagY + tagH);
          ctxMain.lineTo(tagX + tagH/2, tagY + tagH);
          ctxMain.quadraticCurveTo(tagX, tagY + tagH, tagX, tagY + tagH - tagH/2);
          ctxMain.lineTo(tagX, tagY + tagH/2);
          ctxMain.quadraticCurveTo(tagX, tagY, tagX + tagH/2, tagY);
        }
        ctxMain.fill();
        
        ctxMain.fillStyle = '#1e293b';
        ctxMain.font = `500 ${tagFontSize}px system-ui, -apple-system, sans-serif`;
        ctxMain.textAlign = 'center';
        ctxMain.textBaseline = 'middle';
        ctxMain.fillText(tagText, width / 2, tagY + tagH / 2);

        if (useBgImage && imgLoaded && img.width && img.height) {
          previewCanvasWrap.style.aspectRatio = `${mainCanvas.width} / ${mainCanvas.height}`;
        } else {
          previewCanvasWrap.style.aspectRatio = '1 / 1';
        }
      }

      // --- 记住下载文件夹（把文件夹句柄存进 IndexedDB，刷新后不用重选） ---
      function openHandleDb() {
        return new Promise(function(resolve, reject) {
          if (typeof indexedDB === 'undefined') {
            reject(new Error('当前浏览器不支持 IndexedDB'));
            return;
          }
          const request = indexedDB.open('fontPreviewTool', 1);
          request.onupgradeneeded = function() {
            const db = request.result;
            if (!db.objectStoreNames.contains('handles')) {
              db.createObjectStore('handles');
            }
          };
          request.onsuccess = function() { resolve(request.result); };
          request.onerror = function() { reject(request.error); };
        });
      }

      async function saveDirectoryHandleToDb(handle) {
        if (!handle) return;
        try {
          const db = await openHandleDb();
          await new Promise(function(resolve, reject) {
            const tx = db.transaction('handles', 'readwrite');
            tx.objectStore('handles').put(handle, 'saveDirectory');
            tx.oncomplete = function() { resolve(); };
            tx.onerror = function() { reject(tx.error); };
          });
          db.close();
        } catch (e) {
          console.warn('保存下载文件夹失败:', e);
        }
      }

      async function loadDirectoryHandleFromDb() {
        try {
          const db = await openHandleDb();
          const handle = await new Promise(function(resolve, reject) {
            const tx = db.transaction('handles', 'readonly');
            const req = tx.objectStore('handles').get('saveDirectory');
            req.onsuccess = function() { resolve(req.result || null); };
            req.onerror = function() { reject(req.error); };
          });
          db.close();
          return handle;
        } catch (e) {
          return null;
        }
      }

      async function clearDirectoryHandleFromDb() {
        try {
          const db = await openHandleDb();
          await new Promise(function(resolve, reject) {
            const tx = db.transaction('handles', 'readwrite');
            tx.objectStore('handles').delete('saveDirectory');
            tx.oncomplete = function() { resolve(); };
            tx.onerror = function() { reject(tx.error); };
          });
          db.close();
        } catch (e) {}
      }

      async function restoreSaveDirectoryHandle() {
        if (!window.showDirectoryPicker) return;
        const handle = await loadDirectoryHandleFromDb();
        if (!handle) return;

        try {
          let permission = 'granted';
          if (typeof handle.queryPermission === 'function') {
            permission = await handle.queryPermission({ mode: 'readwrite' });
          }
          if (permission === 'denied') {
            await clearDirectoryHandleFromDb();
            return;
          }
          saveDirectoryHandle = handle;
          if (permission === 'granted') {
            pathStatus.textContent = `已记住：${handle.name}`;
            pathStatus.style.color = '#10b981';
          } else {
            pathStatus.textContent = `已记住：${handle.name}（下载时确认）`;
            pathStatus.style.color = '#d97706';
          }
        } catch (e) {
          console.warn('恢复下载文件夹失败:', e);
        }
      }

      // --- 下载逻辑 ---
      async function downloadImage(isRound, btnElement) {
        const originalText = btnElement.textContent;
        btnElement.textContent = '保存中...';
        btnElement.classList.add('saving');
        btnElement.classList.remove('saved');

        try {
          if (!saveDirectoryHandle) {
            if (!window.showDirectoryPicker) {
              alert('当前浏览器不支持选择保存目录，将使用默认下载方式。');
              return fallbackDownload(isRound, btnElement, originalText);
            }
            try {
              saveDirectoryHandle = await window.showDirectoryPicker();
              const permission = await saveDirectoryHandle.requestPermission({ mode: 'readwrite' });
              if (permission === 'granted') {
                pathStatus.textContent = `已绑定：${saveDirectoryHandle.name}`;
                pathStatus.style.color = '#10b981';
                saveDirectoryHandleToDb(saveDirectoryHandle);
              } else {
                btnElement.textContent = originalText;
                btnElement.classList.remove('saving');
                return;
              }
            } catch (err) {
              if (err.name === 'AbortError') {
                btnElement.textContent = originalText;
                btnElement.classList.remove('saving');
                return;
              }
              throw err;
            }
          }

          const quality = document.querySelector('input[name="downloadQuality"]:checked').value;
          let exportWidth = quality === 'original' ? 2400 : 1200;
          
          const exportCanvas = document.createElement('canvas');
          exportCanvas.width = exportWidth;
          exportCanvas.height = exportWidth * (mainCanvas.height / mainCanvas.width);
          const eCtx = exportCanvas.getContext('2d');
          eCtx.drawImage(mainCanvas, 0, 0, exportCanvas.width, exportCanvas.height);

          let finalCanvas = exportCanvas;
          if (isRound) {
            const roundCanvas = document.createElement('canvas');
            roundCanvas.width = exportCanvas.width;
            roundCanvas.height = exportCanvas.height;
            const rCtx = roundCanvas.getContext('2d');
            const radius = Math.min(roundCanvas.width, roundCanvas.height) * 0.06;

            rCtx.beginPath();
            if (rCtx.roundRect) {
              rCtx.roundRect(0, 0, roundCanvas.width, roundCanvas.height, radius);
            } else {
              rCtx.moveTo(radius, 0);
              rCtx.lineTo(roundCanvas.width - radius, 0);
              rCtx.quadraticCurveTo(roundCanvas.width, 0, roundCanvas.width, radius);
              rCtx.lineTo(roundCanvas.width, roundCanvas.height - radius);
              rCtx.quadraticCurveTo(roundCanvas.width, roundCanvas.height, roundCanvas.width - radius, roundCanvas.height);
              rCtx.lineTo(radius, roundCanvas.height);
              rCtx.quadraticCurveTo(0, roundCanvas.height, 0, roundCanvas.height - radius);
              rCtx.lineTo(0, radius);
              rCtx.quadraticCurveTo(0, 0, radius, 0);
            }
            rCtx.clip();
            rCtx.drawImage(exportCanvas, 0, 0);
            finalCanvas = roundCanvas;
          }

          const blob = await new Promise(resolve => finalCanvas.toBlob(resolve, 'image/png'));
          const safeName = currentFontDisplayName.replace(/[\\/:*?"<>|]/g, '_').substring(0, 30);
          const suffix = isRound ? '圆角' : '方角';
          const fileName = `字体预览_${safeName}_${suffix}.png`;

          try {
            const permission = await saveDirectoryHandle.requestPermission({ mode: 'readwrite' });
            if (permission === 'granted') {
              const fileHandle = await saveDirectoryHandle.getFileHandle(fileName, { create: true });
              const writable = await fileHandle.createWritable();
              await writable.write(blob);
              await writable.close();
              
              pathStatus.textContent = `已绑定：${saveDirectoryHandle.name}`;
              pathStatus.style.color = '#10b981';
              saveDirectoryHandleToDb(saveDirectoryHandle);

              btnElement.textContent = '保存成功！';
              btnElement.classList.remove('saving');
              btnElement.classList.add('saved');
              showToast('✅ 图片已成功保存到指定文件夹');
              setTimeout(() => {
                btnElement.textContent = originalText;
                btnElement.classList.remove('saved');
              }, 1500);
              return;
            }

            // 权限被拒绝或需要重新确认时，不能让按钮一直停在“保存中”
            saveDirectoryHandle = null;
            clearDirectoryHandleFromDb();
            pathStatus.textContent = '未选择文件夹';
            pathStatus.style.color = '';
            btnElement.textContent = originalText;
            btnElement.classList.remove('saving');
            showToast('⚠️ 没有文件夹写入权限，请重新设定下载文件夹');
            return;
          } catch (err) {
            console.error('写入失败:', err);
            alert('保存失败，请重新设定下载文件夹。');
            saveDirectoryHandle = null;
            clearDirectoryHandleFromDb();
            pathStatus.textContent = '未选择文件夹';
            btnElement.textContent = originalText;
            btnElement.classList.remove('saving');
          }
        } catch (error) {
          console.error(error);
          btnElement.textContent = originalText;
          btnElement.classList.remove('saving');
          alert('发生未知错误，请重试');
        }
      }

      function fallbackDownload(isRound, btnElement, originalText) {
        const quality = document.querySelector('input[name="downloadQuality"]:checked').value;
        let exportWidth = quality === 'original' ? 2400 : 1200;
        
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = exportWidth;
        exportCanvas.height = exportWidth * (mainCanvas.height / mainCanvas.width);
        const eCtx = exportCanvas.getContext('2d');
        eCtx.drawImage(mainCanvas, 0, 0, exportCanvas.width, exportCanvas.height);

        let finalCanvas = exportCanvas;
        if (isRound) {
          const roundCanvas = document.createElement('canvas');
          roundCanvas.width = exportCanvas.width;
          roundCanvas.height = exportCanvas.height;
          const rCtx = roundCanvas.getContext('2d');
          const radius = Math.min(roundCanvas.width, roundCanvas.height) * 0.06;
          rCtx.beginPath();
          rCtx.roundRect(0, 0, roundCanvas.width, roundCanvas.height, radius);
          rCtx.clip();
          rCtx.drawImage(exportCanvas, 0, 0);
          finalCanvas = roundCanvas;
        }

        const safeName = currentFontDisplayName.replace(/[\\/:*?"<>|]/g, '_').substring(0, 30);
        const suffix = isRound ? '圆角' : '方角';
        const fileName = `字体预览_${safeName}_${suffix}.png`;
        
        // 这里不能用 URL.createObjectURL：它只接受 Blob，传 DataURL 字符串会直接报错
        const a = document.createElement('a');
        a.href = finalCanvas.toDataURL('image/png');
        a.download = fileName;
        a.click();
        
        btnElement.textContent = '下载完成！';
        btnElement.classList.remove('saving');
        btnElement.classList.add('saved');
